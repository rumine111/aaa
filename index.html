<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webtoon Seamless Join</title>
    <style>
      :root {
        --bg: #000;
        --page-width: 100%;
        --overlap: 1px;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
      }

      body {
        overflow-x: hidden;
      }

      .comic-page {
        width: min(var(--page-width), 100%);
        margin: 0 auto;
        line-height: 0;
        font-size: 0;
        background: #fff;
      }

      .panel {
        display: block;
        width: 100%;
        height: auto;
        margin: 0;
        padding: 0;
        border: 0;
        vertical-align: top;
        user-select: none;
        -webkit-user-drag: none;
        image-rendering: auto;
      }

      /* 경계선이 보일 때만 이 값을 1~3px 정도로 조절 */
      .panel.bottom {
        margin-top: calc(var(--overlap) * -1);
      }
    </style>
  </head>
  <body>
    <main class="comic-page" aria-label="webtoon images">
      <img class="panel top" src="https://pub-361887c201474be4910b7eba9102b585.r2.dev/2310.jpg" alt="웹툰 이미지 1" />
      <img class="panel bottom" src="https://pub-361887c201474be4910b7eba9102b585.r2.dev/2311.jpg" alt="웹툰 이미지 2" />
    </main>
  </body>
</html>
